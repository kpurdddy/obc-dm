<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OB Clark's -- Dan's Kitchen</title>
<style>
:root {
  --color-amber: #d97706;
  --color-orange: #f97316;
  --color-red: #ef4444;
  --color-sky: #0ea5e9;
  --color-teal: #14b8a6;
  --color-green: #22c55e;
  --color-slate: #475569;
  --color-rose: #f43f5e;
  --color-fuchsia: #d946ef;
  --color-lime: #84cc16;
  --color-cyan: #06b6d4;
  --color-pink: #ec4899;
  --color-yellow-green: #a3e635;
  --color-zinc: #71717a;
  --color-zinc-light: #a1a1aa;
  --color-red-orange: #ea580c;
  --color-violet: #7c3aed;
  --color-gold: #ca8a04;
  --color-crimson: #dc2626;
  --color-warm-gray: #78716c;
  --color-emerald: #059669;
  --color-amber-dark: #b45309;
  --color-spring-green: #4ade80;
  --color-rose-light: #fb7185;
  --color-purple: #9333ea;
  --color-tan: #a16207;
  --color-olive: #65a30d;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Courier New', monospace;
  color: #fff;
}

#root {
  width: 100%;
  height: 100%;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 6px 2px currentColor; }
  50% { box-shadow: 0 0 12px 4px currentColor; }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fade-out {
  from { opacity: 1; }
  to { opacity: 0; }
}

@keyframes slide-in-right {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes slide-to-counter {
  from { transform: translateY(-30px); opacity: 0.7; }
  to { transform: translateY(0); opacity: 1; }
}

.title-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
  background: #000;
  animation: fade-in 0.5s ease;
}

.title-main {
  font-size: 12vw;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fff;
}

.title-sub {
  font-size: 6vw;
  font-weight: 400;
  color: #ccc;
  margin-top: 1vh;
}

.title-version {
  font-size: 5vw;
  color: #888;
  margin-top: 2vh;
}

.start-btn {
  margin-top: 8vh;
  padding: 3vh 8vw;
  font-size: 5vw;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  color: #000;
  background: #fff;
  border: none;
  cursor: pointer;
  animation: pulse 2s infinite;
}

.game-container {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  background: #1a1a1a;
  position: relative;
  animation: fade-in 0.8s ease;
}

.active-grid-area {
  height: 108px;
  width: 100%;
  display: flex;
  align-items: center;
  position: relative;
  background: #111;
  flex-shrink: 0;
}

.active-grid {
  width: 55vw;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 36px);
  position: absolute;
  transition: left 0.3s ease;
}

.grid-cell {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 600;
  font-size: 10px;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  border-radius: 0;
  position: relative;
  transition: opacity 0.2s;
}

.grid-cell.disabled {
  opacity: 0.4;
  cursor: default;
}

.grid-cell.pulsing {
  animation: pulse 1s infinite;
}

.grid-cell .cook-border {
  position: absolute;
  inset: 0;
  border: 2px solid transparent;
  pointer-events: none;
}

.kitchen-scene {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.back-wall {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 8px 4px;
  height: 40%;
  position: relative;
}

.station-box {
  width: 28%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 4px;
  border: 1px solid #333;
  background: #222;
  position: relative;
  cursor: pointer;
  transition: all 0.2s;
}

.station-box.active {
  background: #2a2a2a;
  border-color: #555;
  transform: scale(1.03);
}

.station-box.freezer {
  width: 12%;
  cursor: default;
}

.station-label {
  font-size: 8px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.station-box.active .station-label {
  color: #fff;
}

.mini-grid {
  display: grid;
  grid-template-columns: repeat(3, 16px);
  grid-template-rows: repeat(3, 16px);
  gap: 1px;
  border: 1px solid #333;
}

.mini-cell {
  width: 16px;
  height: 16px;
  transition: background 0.3s, box-shadow 0.3s;
}

.mini-cell.alert-red {
  box-shadow: 0 0 6px 2px rgba(239,68,68,0.8);
}

.mini-cell.alert-yellow {
  box-shadow: 0 0 6px 2px rgba(234,179,8,0.8);
}

.mini-cell.alert-green {
  box-shadow: 0 0 6px 2px rgba(34,197,94,0.8);
}

.lower-area {
  height: 60%;
  position: relative;
  display: flex;
}

.l-counter {
  position: absolute;
  background: #444;
}

.l-horizontal {
  position: absolute;
  height: 24px;
  background: #555;
  top: 0;
  right: 4px;
  left: 40%;
  border: 1px solid #666;
}

.l-vertical {
  position: absolute;
  width: 24px;
  background: #555;
  top: 0;
  left: 40%;
  bottom: 10px;
  border: 1px solid #666;
}

.prep-area {
  position: absolute;
  left: calc(40% - 60px);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.prep-station {
  width: 56px;
  height: 40px;
  background: #2a2a2a;
  border: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 7px;
  color: #999;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}

.prep-station.active {
  background: #333;
  border-color: #666;
  color: #fff;
}

.dan-sprite {
  width: 20px;
  height: 30px;
  background: #e0c080;
  border: 2px solid #c0a060;
  border-radius: 4px 4px 0 0;
  position: absolute;
  transition: left 0.3s ease, top 0.5s ease;
  z-index: 10;
}

.dan-sprite.meltdown {
  transform: scaleY(0.9);
  background: #d0a070;
}

.dan-sprite::before {
  content: '';
  display: block;
  width: 14px;
  height: 14px;
  background: #f0d090;
  border-radius: 50%;
  margin: -10px auto 0;
  border: 2px solid #c0a060;
}

.plate-circle {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 5px;
  font-weight: 700;
  color: #fff;
  animation: slide-to-counter 0.3s ease;
}

.plate-circle.cooling {
  opacity: 0.5;
}

.plate-circle.complete {
  animation: pulse 0.5s 3;
  box-shadow: 0 0 6px 2px rgba(34,197,94,0.8);
}

.ticket-rail {
  position: absolute;
  bottom: 4px;
  left: 4px;
  right: 4px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding: 4px;
}

.ticket {
  background: #f5f0e0;
  color: #333;
  padding: 4px 6px;
  font-size: 8px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  animation: slide-in-right 0.3s ease;
  border-left: 3px solid #999;
}

.ticket.aging {
  background: #f0e0c0;
  border-left-color: #e0a000;
}

.ticket.old {
  background: #ecd0a0;
  border-left-color: #e06000;
}

.ticket.complete {
  opacity: 0.3;
  transition: opacity 0.5s;
}

.ticket.tutorial-glow {
  animation: slide-in-right 0.3s ease, glow-pulse 1.5s infinite;
  box-shadow: 0 0 8px 2px rgba(34,197,94,0.5);
}

.meltdown-meter {
  position: absolute;
  left: 2px;
  top: 10%;
  bottom: 10%;
  width: 8px;
  background: #222;
  border: 1px solid #333;
  z-index: 20;
  display: flex;
  flex-direction: column-reverse;
}

.meltdown-fill {
  width: 100%;
  transition: height 0.5s, background 0.5s;
}

.meltdown-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 15;
  box-shadow: inset 0 0 60px 30px rgba(0,0,0,0.7);
}

.hint-message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 14px;
  color: #fff;
  background: rgba(0,0,0,0.8);
  padding: 8px 16px;
  z-index: 25;
  animation: fade-in 0.3s;
  text-align: center;
  pointer-events: none;
}

.nice-text {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 15vw;
  font-weight: 700;
  color: #fff;
  z-index: 30;
  animation: fade-in 0.3s;
  pointer-events: none;
}

.tickets-peek-btn {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #ccc;
  border: 1px solid #555;
  padding: 4px 12px;
  font-size: 9px;
  font-family: 'Courier New', monospace;
  text-transform: uppercase;
  cursor: pointer;
  z-index: 20;
}

.oven-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

.oven-pizza-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #ca8a04;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 7px;
  font-weight: 600;
  position: relative;
}

.oven-timer-ring {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 3px solid;
  transition: border-color 0.5s;
}

.pull-btn {
  width: 80%;
  height: 60px;
  background: var(--color-green);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  border: none;
  cursor: pointer;
  text-transform: uppercase;
  margin: auto;
}

.oven-timer-text {
  font-size: 20px;
  font-weight: 700;
  color: #ccc;
  margin-top: 8px;
}

.cook-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.cook-item-visual {
  width: 30px;
  height: 20px;
  border-radius: 2px;
  transition: background 0.5s;
}

.cook-item-bar {
  width: 30px;
  height: 3px;
  background: #333;
  position: relative;
}

.cook-item-bar-fill {
  height: 100%;
  transition: width 0.3s, background 0.3s;
}

.cook-item-label {
  font-size: 6px;
  color: #ccc;
}

.grill-surface {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
}

.fryer-surface {
  display: flex;
  gap: 4px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 8px;
}

.holding-bowl {
  position: absolute;
  bottom: 4px;
  right: 4px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #555;
  border: 1px solid #777;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  font-weight: 700;
  color: #fff;
}

.results-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
  background: #000;
  animation: fade-in 0.8s ease;
  gap: 2vh;
  padding: 4vh;
}

.results-title {
  font-size: 8vw;
  font-weight: 700;
}

.results-line {
  font-size: 4vw;
  color: #ccc;
}

.results-stars {
  font-size: 8vw;
  color: #d97706;
  letter-spacing: 4px;
}

.play-again-btn {
  margin-top: 4vh;
  padding: 2vh 6vw;
  font-size: 4vw;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  color: #000;
  background: #fff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
// Copyright 2026 Kip. All rights reserved.

var VERSION = "Alpha 0.2.2";

var e = React.createElement;
var useState = React.useState;
var useReducer = React.useReducer;
var useEffect = React.useEffect;
var useRef = React.useRef;
var useCallback = React.useCallback;

// ==================== SOUND MANAGER ====================
var SoundManager = {
  ctx: null,
  ambientNode: null,
  ambientGain: null,
  fryNode: null,
  fryGain: null,
  burnOsc: null,
  burnGain: null,

  init: function() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.startAmbient();
  },

  startAmbient: function() {
    if (!this.ctx) return;
    var bufSize = 2 * this.ctx.sampleRate;
    var buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    var data = buf.getChannelData(0);
    var lastOut = 0;
    for (var i = 0; i < bufSize; i++) {
      var white = Math.random() * 2 - 1;
      lastOut = (lastOut + (0.02 * white)) / 1.02;
      data[i] = lastOut * 3.5;
    }
    var node = this.ctx.createBufferSource();
    node.buffer = buf;
    node.loop = true;
    var gain = this.ctx.createGain();
    gain.gain.value = 0.03;
    var filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 200;
    node.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    node.start();
    this.ambientNode = node;
    this.ambientGain = gain;
  },

  setAmbientMood: function(level) {
    if (!this.ambientGain) return;
    var vol = 0.03 + (level / 100) * 0.04;
    this.ambientGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.5);
  },

  playGrillSizzle: function() {
    if (!this.ctx) return;
    var bufSize = this.ctx.sampleRate * 0.3;
    var buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    }
    var src = this.ctx.createBufferSource();
    src.buffer = buf;
    var bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 3000 + Math.random() * 2000;
    bp.Q.value = 1;
    var gain = this.ctx.createGain();
    gain.gain.value = 0.15;
    src.connect(bp);
    bp.connect(gain);
    gain.connect(this.ctx.destination);
    src.start();
  },

  playFrySustain: function() {
    if (!this.ctx || this.fryNode) return;
    var bufSize = 2 * this.ctx.sampleRate;
    var buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.5;
    }
    var src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    var bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 4000;
    bp.Q.value = 0.5;
    var gain = this.ctx.createGain();
    gain.gain.value = 0.06;
    src.connect(bp);
    bp.connect(gain);
    gain.connect(this.ctx.destination);
    src.start();
    this.fryNode = src;
    this.fryGain = gain;
  },

  stopFry: function() {
    if (this.fryNode) {
      try { this.fryNode.stop(); } catch(ex) {}
      this.fryNode = null;
      this.fryGain = null;
    }
  },

  plateClink: function() {
    if (!this.ctx) return;
    var osc = this.ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 800;
    var gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.05);
  },

  ticketArrival: function() {
    if (!this.ctx) return;
    var bufSize = this.ctx.sampleRate * 0.1;
    var buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    }
    var src = this.ctx.createBufferSource();
    src.buffer = buf;
    var hp = this.ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2000;
    var gain = this.ctx.createGain();
    gain.gain.value = 0.1;
    src.connect(hp);
    hp.connect(gain);
    gain.connect(this.ctx.destination);
    src.start();
  },

  startBurnWarning: function() {
    if (!this.ctx || this.burnOsc) return;
    var osc = this.ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 200;
    var gain = this.ctx.createGain();
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(0.15, this.ctx.currentTime + 2);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    this.burnOsc = osc;
    this.burnGain = gain;
  },

  stopBurnWarning: function() {
    if (this.burnOsc) {
      try { this.burnOsc.stop(); } catch(ex) {}
      this.burnOsc = null;
      this.burnGain = null;
    }
  },

  meltdownChime: function() {
    if (!this.ctx) return;
    var osc = this.ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(200, this.ctx.currentTime + 0.5);
    var gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.5);
  },

  tutorialChime: function() {
    if (!this.ctx) return;
    var osc1 = this.ctx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = 523;
    var gain1 = this.ctx.createGain();
    gain1.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
    osc1.connect(gain1);
    gain1.connect(this.ctx.destination);
    osc1.start(this.ctx.currentTime);
    osc1.stop(this.ctx.currentTime + 0.1);

    var osc2 = this.ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = 659;
    var gain2 = this.ctx.createGain();
    gain2.gain.setValueAtTime(0.2, this.ctx.currentTime + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    osc2.connect(gain2);
    gain2.connect(this.ctx.destination);
    osc2.start(this.ctx.currentTime + 0.1);
    osc2.stop(this.ctx.currentTime + 0.2);
  }
};

// ==================== CONSTANTS ====================
var STATIONS = {
  PIZZA_OVEN: 'PIZZA_OVEN',
  GRILL: 'GRILL',
  FRYER: 'FRYER',
  PREP: 'PREP',
  SALAD: 'SALAD'
};

var BACK_WALL_STATIONS = [STATIONS.PIZZA_OVEN, STATIONS.GRILL, STATIONS.FRYER];

var COOK_TIMES = {
  BURGER: 6,
  GROUPER: 8,
  CHICKEN: 7,
  FRIES: 5,
  SHROOMS: 4,
  'G.BEANS': 4,
  WINGS: 7,
  'CH.BALL': 5,
  SHAKE: 3,
  PIZZA: 10,
  SALAD: 0
};

var FLIP_FRACTION = 0.5;
var GRACE_WINDOW = 3;
var MINOR_PENALTY_WINDOW = 6;

var GRILL_GRID_DEFAULT = [
  { label: 'CHICKEN', color: '#d97706', action: 'PLACE_CHICKEN' },
  { label: 'GROUPER', color: '#f97316', action: 'PLACE_GROUPER' },

// ==================== HELPERS ====================
var nextTicketId = 1;

function generateTicket(shiftTime) {
  var phase = 0;
  if (shiftTime >= 480) phase = 3;
  else if (shiftTime >= 300) phase = 2;
  else if (shiftTime >= 120) phase = 1;

  var pool = TICKET_ITEMS_BY_PHASE[phase];
  var numItems = phase >= 3 ? (Math.random() < 0.3 ? 2 : 1) : 1;
  var items = [];
  for (var i = 0; i < numItems; i++) {
    var type = pool[Math.floor(Math.random() * pool.length)];
    var qty = 1;
    if ((type === 'FRIES' || type === 'WINGS' || type === 'CH.BALL') && Math.random() < 0.2) {
      qty = 3;
    }
    items.push({ type: type, qty: qty, plated: 0 });
  }
  var id = nextTicketId++;
  return {
    id: id,
    items: items,
    arrivalTime: shiftTime,
    completed: false,
    label: items.map(function(it) { return it.qty + 'x ' + it.type; }).join(' + ')
  };
}

function getTicketInterval(shiftTime) {
  if (shiftTime < 120) return 20;
  if (shiftTime < 300) return 15;
  if (shiftTime < 480) return 10;
  return 7.5;
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function dimColor(hex, factor) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  r = Math.floor(r * factor);
  g = Math.floor(g * factor);
  b = Math.floor(b * factor);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function cookProgressColor(progress) {
  if (progress < 0.5) return '#22c55e';
  if (progress < 0.8) return '#eab308';
  return '#ef4444';
}

function itemStation(type) {
  if (type === 'BURGER' || type === 'GROUPER' || type === 'CHICKEN') return STATIONS.GRILL;
  if (type === 'PIZZA') return STATIONS.PREP;
  if (type === 'SALAD') return STATIONS.SALAD;
  return STATIONS.FRYER;
}

function computeStars(completed, total, burned, meltdowns) {
  if (total === 0) return 3;
  var ratio = completed / total;
  var score = ratio * 100;
  score -= burned * 5;
  score -= meltdowns * 10;
  if (score >= 90) return 5;
  if (score >= 75) return 4;
  if (score >= 55) return 3;
  if (score >= 35) return 2;
  return 1;
}

      var sal2 = state.stations.SALAD;
      if (!sal2.currentSalad) {
        sal2 = Object.assign({}, sal2, { currentSalad: { ingredients: [] } });
      }
      var ings = sal2.currentSalad.ingredients.slice();
      ings.push(action.ingredient);
      return Object.assign({}, state, {
        stations: Object.assign({}, state.stations, {
          SALAD: Object.assign({}, sal2, {
            currentSalad: Object.assign({}, sal2.currentSalad, { ingredients: ings })
          })
        })
      });

    case 'SALAD_PLATE':
      var sal3 = state.stations.SALAD;
      if (!sal3.currentSalad || sal3.currentSalad.ingredients.length === 0) return state;
      var matchTicket4 = null;
      var newRail5 = state.ticketRail.map(function(t) {
        if (matchTicket4) return t;
        if (t.completed) return t;
        var updated = false;
        var newItems = t.items.map(function(ti) {
          if (!updated && ti.type === 'SALAD' && ti.plated < ti.qty) {
            updated = true;
            return Object.assign({}, ti, { plated: ti.plated + 1 });
          }
          return ti;
        });
        if (updated) {
          matchTicket4 = t;
          var allDone = newItems.every(function(ti) { return ti.plated >= ti.qty; });
          return Object.assign({}, t, { items: newItems, completed: allDone });
        }
        return t;
      });
      var completedNow4 = matchTicket4 && newRail5.find(function(t) { return t.id === matchTicket4.id; });
      var newScore4 = state.score;
      if (completedNow4 && completedNow4.completed) {
        newScore4 = Object.assign({}, state.score, { ticketsCompleted: state.score.ticketsCompleted + 1 });
      }
      return Object.assign({}, state, {
        stations: Object.assign({}, state.stations, {
          SALAD: Object.assign({}, sal3, { currentSalad: null })
        }),
        counterPlates: state.counterPlates.concat([{ type: 'SALAD', ticketId: matchTicket4 ? matchTicket4.id : 0, platedAt: state.shiftTime }]),
        ticketRail: newRail5,
        score: newScore4
      });

    case 'TICK':
      return tickReducer(state, action.dt);

    case 'RESET':
      nextTicketId = 1;
      return makeInitialState();

    default:
      return state;
  }
}

function tickReducer(state, dt) {
  if (state.phase !== 'TUTORIAL' && state.phase !== 'PLAYING') return state;

  var s = Object.assign({}, state);

  // Tutorial tick
  if (s.phase === 'TUTORIAL') {
    s.idleTimer = (s.idleTimer || 0) + dt;

    // Tutorial step timers
    if (s.tutorialStep === 1) {
      // Wait a beat then show ticket
      s.hintTimer = (s.hintTimer || 0) + dt;
      if (s.hintTimer > 1) {
        s.tutorialStep = 2;
        s.ticketRail = [{ id: nextTicketId++, items: [{ type: 'BURGER', qty: 1, plated: 0 }], arrivalTime: 0, completed: false, label: '1x BURGER' }];
        s.hintMessage = 'TAP THE GRILL';
        s.idleTimer = 0;
      }
    }

    // Cook timer during tutorial
    if (s.tutorialStep === 4 || s.tutorialStep === 6) {
      var gItems = s.stations.GRILL.items;
      if (gItems.length > 0) {
        var it = gItems[0];
        var newProgress = it.cookProgress + dt;
        var flipPoint = it.cookTime * FLIP_FRACTION;

        if (s.tutorialStep === 4 && !it.flipped && newProgress >= flipPoint) {
          s.tutorialStep = 5;
          s.hintMessage = 'FLIP IT';
          s.idleTimer = 0;
          it = Object.assign({}, it, { cookProgress: flipPoint, needsFlip: true });
        } else if (s.tutorialStep === 6 && it.flipped && newProgress >= it.cookTime) {
          s.tutorialStep = 7;
          s.hintMessage = 'PLATE IT';
          s.idleTimer = 0;
          it = Object.assign({}, it, { cookProgress: it.cookTime, done: true });
        } else {
          it = Object.assign({}, it, { cookProgress: newProgress });
        }
        s.stations = Object.assign({}, s.stations, {
          GRILL: Object.assign({}, s.stations.GRILL, { items: [it] })
        });
      }
    }

    // Nice timer
    if (s.niceShow) {
      s.niceTimer -= dt;
      if (s.niceTimer <= 0) {
        s.niceShow = false;
        s.hintMessage = 'HERE THEY COME.';
        s.tutorialStep = 9;
        s.niceTimer = 0;
      }
    }

    // Transition from tutorial step 9 to playing
    if (s.tutorialStep === 9 && !s.niceShow) {
      s.hintTimer = (s.hintTimer || 0) + dt;
      if (s.hintTimer > 2) {
        s.phase = 'PLAYING';
        s.tutorialStep = 0;
        s.hintMessage = null;
        s.hintTimer = 0;
        s.ticketRail = [];
        s.counterPlates = [];
        s.shiftTime = 0;
        s.nextTicketTime = 2;
        s.score = { ticketsCompleted: 0, totalTickets: 0, itemsBurned: 0, stars: 0 };
      }
    }

    // Idle hint repeat
    if (s.idleTimer > 8 && s.hintMessage && s.tutorialStep >= 2 && s.tutorialStep <= 7) {
      s.idleTimer = 0;
    }

    return s;
  }

  // ===== PLAYING phase =====
  s.shiftTime += dt;

  // Peek timer
  if (s.ticketPeek) {
    s.peekTimer -= dt;
    if (s.peekTimer <= 0) {
      s.ticketPeek = false;
      s.peekTimer = 0;
    }
  }

  // Ticket arrival
  if (!s.shiftOver && s.shiftTime >= s.nextTicketTime) {
    var ticket = generateTicket(s.shiftTime);
    s.ticketRail = s.ticketRail.concat([ticket]);
    s.score = Object.assign({}, s.score, { totalTickets: s.score.totalTickets + 1 });
    s.nextTicketTime = s.shiftTime + getTicketInterval(s.shiftTime);
    SoundManager.ticketArrival();
  }

  // Shift end check
  if (s.shiftTime >= 600 && !s.shiftOver) {
    s.shiftOver = true;
  }

  // Grace period after shift over
  if (s.shiftOver) {
    s.graceTimer = (s.graceTimer || 0) + dt;
    var allCleared = s.ticketRail.every(function(t) { return t.completed; });
    if (allCleared || s.graceTimer >= 120) {
      var stars = computeStars(s.score.ticketsCompleted, s.score.totalTickets, s.score.itemsBurned, s.meltdownCount);
      s.score = Object.assign({}, s.score, { stars: stars });
      s.phase = 'SHIFT_END';
      return s;
    }
  }

  // Clean completed tickets
  s.ticketRail = s.ticketRail.filter(function(t) {
    if (t.completed && (s.shiftTime - (t.completedAt || t.arrivalTime)) > 2) return false;
    return true;
  });

  // Cook timers - Grill
  var grillStation = s.stations.GRILL;
  var hasBurning = false;
  var grillItems = grillStation.items.map(function(it) {
    if (it.done || it.waitingForSeason) return it;
    var cp = it.cookProgress + dt;
    var flipPoint = it.cookTime * FLIP_FRACTION;
    var newIt = Object.assign({}, it, { cookProgress: cp });

    if (!it.flipped && cp >= flipPoint) {
      newIt.needsFlip = true;
      var late = cp - flipPoint;
      if (late > MINOR_PENALTY_WINDOW) {
        newIt.quality = Math.max(0, newIt.quality - 0.3);
        newIt.burned = true;
        hasBurning = true;
      } else if (late > GRACE_WINDOW) {
        newIt.quality = Math.max(0, newIt.quality - 0.1);
      }
    }

    if (it.flipped && cp >= it.cookTime) {
      newIt.done = true;
      var late2 = cp - it.cookTime;
      if (late2 > MINOR_PENALTY_WINDOW) {
        newIt.quality = Math.max(0, newIt.quality - 0.3);
        newIt.burned = true;
        hasBurning = true;
      } else if (late2 > GRACE_WINDOW) {
        newIt.quality = Math.max(0, newIt.quality - 0.1);
      }
    }

    if (cp > it.cookTime + MINOR_PENALTY_WINDOW && it.flipped) hasBurning = true;
    if (!it.flipped && cp > flipPoint + MINOR_PENALTY_WINDOW) hasBurning = true;

    return newIt;
  });
  s.stations = Object.assign({}, s.stations, {
    GRILL: Object.assign({}, grillStation, { items: grillItems })
  });

  // Cook timers - Fryer
  var fryerStation = s.stations.FRYER;
  var fryerItems = fryerStation.items.map(function(it) {
    if (it.done) return it;
    if (it.isMilkshake) {
      var cp = it.cookProgress + dt;
      if (cp >= it.cookTime) {
        return Object.assign({}, it, { cookProgress: cp, done: true });
      }
      return Object.assign({}, it, { cookProgress: cp });
    }
    var cp2 = it.cookProgress + dt;
    var shakePoint = it.cookTime * FLIP_FRACTION;
    var newIt = Object.assign({}, it, { cookProgress: cp2 });

    if (!it.shaken && cp2 >= shakePoint) {
      newIt.needsShake = true;
      var late = cp2 - shakePoint;
      if (late > MINOR_PENALTY_WINDOW) {
        newIt.quality = Math.max(0, newIt.quality - 0.3);
        newIt.burned = true;
        hasBurning = true;
      } else if (late > GRACE_WINDOW) {
        newIt.quality = Math.max(0, newIt.quality - 0.1);
      }
    }

    if (it.shaken && cp2 >= it.cookTime) {
      newIt.done = true;
      var late2 = cp2 - it.cookTime;
      if (late2 > MINOR_PENALTY_WINDOW) {
        newIt.quality = Math.max(0, newIt.quality - 0.3);
        newIt.burned = true;
        hasBurning = true;
      } else if (late2 > GRACE_WINDOW) {
        newIt.quality = Math.max(0, newIt.quality - 0.1);
      }
    }

    return newIt;
  });

  // Manage fry sound
  var hasActiveFry = fryerItems.some(function(it) { return !it.done && !it.isMilkshake; });
  if (hasActiveFry) { SoundManager.playFrySustain(); } else { SoundManager.stopFry(); }

  s.stations = Object.assign({}, s.stations, {
    FRYER: Object.assign({}, fryerStation, { items: fryerItems })
  });

  // Pizza oven timer
  var ovenStation = s.stations.PIZZA_OVEN;
  if (ovenStation.pizza) {
    var ovenProgress = ovenStation.cookProgress + dt;
    if (ovenProgress > COOK_TIMES.PIZZA + MINOR_PENALTY_WINDOW) hasBurning = true;
    s.stations = Object.assign({}, s.stations, {
      PIZZA_OVEN: Object.assign({}, ovenStation, { cookProgress: ovenProgress })
    });
  }

  // Burn warning sound
  if (hasBurning) { SoundManager.startBurnWarning(); } else { SoundManager.stopBurnWarning(); }

  // Holding bowl expiry
  if (s.holdingBowl && (s.shiftTime - s.holdingBowl.createdAt) >= 90) {
    s.holdingBowl = null;
  }

  // Meltdown calculation
  var meltDelta = 0;
  var pendingTickets = s.ticketRail.filter(function(t) { return !t.completed; }).length;
  meltDelta += pendingTickets * 0.5 * dt;
  grillItems.forEach(function(it) { if (it.burned) meltDelta += 3 * dt; });
  fryerItems.forEach(function(it) { if (it.burned) meltDelta += 3 * dt; });

  var ticketsJustCompleted = s.ticketRail.filter(function(t) { return t.completed; }).length;
  meltDelta -= ticketsJustCompleted * 2 * dt;
  if (pendingTickets === 0) meltDelta -= 1 * dt;

  s.meltdown = Math.max(0, Math.min(100, s.meltdown + meltDelta));

  // Meltdown state
  if (s.meltdown >= 100 && !s.inMeltdown) {
    s.inMeltdown = true;
    s.meltdownCount++;
    s.meltdownTimer = 15;
    SoundManager.meltdownChime();
  }
  if (s.inMeltdown) {
    s.meltdownTimer -= dt;
    if (s.meltdownTimer <= 0 || s.meltdown < 60) {
      s.inMeltdown = false;
      s.meltdownTimer = 0;
    }
  }

  // Shuffle grids based on meltdown
  if (s.meltdown >= 60) {
    // All grids shuffle non-structural
    var grillGrid = GRILL_GRID_DEFAULT.slice();
    var shuffleableGrill = [0, 1, 2];
    var shuffledGrill = shuffleArray(shuffleableGrill);
    var newGrillGrid = grillGrid.slice();
    shuffledGrill.forEach(function(origIdx, newIdx) {
      newGrillGrid[newIdx] = grillGrid[shuffleableGrill[origIdx]];
    });
    s.stations = Object.assign({}, s.stations, {
      GRILL: Object.assign({}, s.stations.GRILL, { gridOrder: newGrillGrid }),
      FRYER: Object.assign({}, s.stations.FRYER, {
        gridOrder: (function() {
          var fg = FRYER_GRID_DEFAULT.slice();
          var si = [0, 1, 2, 3, 4, 5];
          var ss = shuffleArray(si);
          var nfg = fg.slice();
          ss.forEach(function(oi, ni) { nfg[ni] = fg[si[oi]]; });
          return nfg;
        })()
      }),
      PREP: Object.assign({}, s.stations.PREP, {
        gridOrder: (function() {
          var pg = PREP_GRID_DEFAULT.slice();
          var si = [];
          pg.forEach(function(c, i) { if (c.shuffleable) si.push(i); });
          var ss = shuffleArray(si);
          var npg = pg.slice();
          ss.forEach(function(oi, ni) { npg[si[ni]] = pg[si[oi]]; });
          return npg;
        })()
      }),
      SALAD: Object.assign({}, s.stations.SALAD, {
        gridOrder: (function() {
          var sg = SALAD_GRID_DEFAULT.slice();
          var si = [0, 1, 2, 3, 4];
          var ss = shuffleArray(si);
          var nsg = sg.slice();
          ss.forEach(function(oi, ni) { nsg[ni] = sg[si[oi]]; });
          return nsg;
        })()
      })
    });
  } else if (s.meltdown >= 30) {
    // Pizza prep only shuffle
    s.stations = Object.assign({}, s.stations, {
      GRILL: Object.assign({}, s.stations.GRILL, { gridOrder: GRILL_GRID_DEFAULT.slice() }),
      FRYER: Object.assign({}, s.stations.FRYER, { gridOrder: FRYER_GRID_DEFAULT.slice() }),
      PREP: Object.assign({}, s.stations.PREP, {
        gridOrder: (function() {
          var pg = PREP_GRID_DEFAULT.slice();
          var si = [];
          pg.forEach(function(c, i) { if (c.shuffleable) si.push(i); });
          var ss = shuffleArray(si);
          var npg = pg.slice();
          ss.forEach(function(oi, ni) { npg[si[ni]] = pg[si[oi]]; });
          return npg;
        })()
      }),
      SALAD: Object.assign({}, s.stations.SALAD, { gridOrder: SALAD_GRID_DEFAULT.slice() })
    });
  } else {
    // Reset all grids to default
    s.stations = Object.assign({}, s.stations, {
      GRILL: Object.assign({}, s.stations.GRILL, { gridOrder: GRILL_GRID_DEFAULT.slice() }),
      FRYER: Object.assign({}, s.stations.FRYER, { gridOrder: FRYER_GRID_DEFAULT.slice() }),
      PREP: Object.assign({}, s.stations.PREP, { gridOrder: PREP_GRID_DEFAULT.slice() }),
      SALAD: Object.assign({}, s.stations.SALAD, { gridOrder: SALAD_GRID_DEFAULT.slice() })
    });
  }

  // Burned items scoring
  var burnCount = 0;
  grillItems.forEach(function(it) { if (it.burned) burnCount++; });
  fryerItems.forEach(function(it) { if (it.burned) burnCount++; });
  s.score = Object.assign({}, s.score, { itemsBurned: burnCount });

  // Ambient mood
  SoundManager.setAmbientMood(s.meltdown);

  return s;
}

// ==================== COMPONENTS ====================

function TitleScreen(props) {
  return e('div', { className: 'title-screen' },
    e('div', { className: 'title-main' }, "OB CLARK'S"),
    e('div', { className: 'title-sub' }, "Dan's Kitchen"),
    e('div', { className: 'title-version' }, VERSION),
    e('button', {
      className: 'start-btn',
      onClick: function() {
        SoundManager.init();
        props.onStart();
      }
    }, 'TAP TO START')
  );
}

function ActiveGrid(props) {
  var station = props.station;
  var state = props.state;
  var dispatch = props.dispatch;

  // Position
  var leftPercent = '22.5%';
  if (station === STATIONS.PIZZA_OVEN) leftPercent = '5%';
  else if (station === STATIONS.GRILL) leftPercent = '22.5%';
  else if (station === STATIONS.FRYER) leftPercent = '40%';
  else leftPercent = '22.5%';

  // Pizza oven special display
  if (station === STATIONS.PIZZA_OVEN) {
    var oven = state.stations.PIZZA_OVEN;
    if (!oven.pizza) {
      return e('div', { className: 'active-grid-area' },
        e('div', { style: { textAlign: 'center', width: '100%', color: '#666', fontSize: '12px' } }, 'OVEN EMPTY')
      );
    }
    var progress = oven.cookProgress / COOK_TIMES.PIZZA;
    var done = oven.cookProgress >= COOK_TIMES.PIZZA;
    var burning = oven.cookProgress > COOK_TIMES.PIZZA + GRACE_WINDOW;
    var ringColor = done ? (burning ? '#ef4444' : '#22c55e') : cookProgressColor(Math.min(progress, 1));

    return e('div', { className: 'active-grid-area', style: { justifyContent: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px' } },
      e('div', { className: 'oven-pizza-circle' },
        e('div', { className: 'oven-timer-ring', style: { borderColor: ringColor } }),
        'PIZZA'
      ),
      done ?
        e('button', { className: 'pull-btn', onClick: function() { dispatch({ type: 'PULL_PIZZA' }); SoundManager.plateClink(); }, style: { width: '55vw', animation: burning ? 'pulse 0.5s infinite' : 'pulse 1s infinite' } }, 'PULL') :
        e('div', { className: 'oven-timer-text' }, Math.max(0, Math.ceil(COOK_TIMES.PIZZA - oven.cookProgress)) + 's')
    );
  }

  var gridData = state.stations[station] ? state.stations[station].gridOrder : [];
  var stationData = state.stations[station] || {};

  // Determine which cells are valid
  function isCellValid(cell, idx) {
    if (!cell.action) return false;
    if (state.phase === 'TUTORIAL') {
      if (state.tutorialStep === 3 && cell.action === 'PLACE_BURGER') return true;
      if (state.tutorialStep === 5 && cell.action === 'FLIP') return true;
      if (state.tutorialStep === 7 && cell.action === 'PLATE') return true;
      return false;
    }

    if (station === STATIONS.GRILL) {
      if (cell.action === 'PLACE_BURGER' || cell.action === 'PLACE_GROUPER' || cell.action === 'PLACE_CHICKEN') {
        return stationData.items.length < 3;
      }
      if (cell.action === 'SEASON') {
        return stationData.items.some(function(it) { return it.waitingForSeason; });
      }
      if (cell.action === 'FLIP') {
        return stationData.items.some(function(it) { return it.needsFlip; });
      }
      if (cell.action === 'PLATE') {
        return stationData.items.some(function(it) { return it.done; });
      }
    }

    if (station === STATIONS.FRYER) {
      if (cell.action === 'BATCH_1' || cell.action === 'BATCH_3') return true;
      if (cell.action === 'PLATE') {
        return stationData.items.some(function(it) { return it.done; });
      }
      if (cell.action === 'SHAKE_OR_MILK') {
        return true;
      }
      // Place items
      if (cell.action && cell.action.startsWith('PLACE_')) return true;
      // Bowl
      if (cell.action === 'BOWL') return state.holdingBowl && state.holdingBowl.count > 0;
    }

    if (station === STATIONS.PREP) {
      if (cell.action === 'DOUGH') return !stationData.currentPizza;
      if (cell.action === 'SEND_OVEN') return stationData.currentPizza && stationData.currentPizza.hasDough && !state.stations.PIZZA_OVEN.pizza;
      if (cell.action && cell.action.startsWith('TOP_')) return stationData.currentPizza && stationData.currentPizza.hasDough;
    }

    if (station === STATIONS.SALAD) {
      if (cell.action === 'PLATE') return stationData.currentSalad && stationData.currentSalad.ingredients.length > 0;
      if (cell.action && cell.action.startsWith('ADD_')) return true;
    }

    return false;
  }

  function handleCellClick(cell) {
    if (!cell.action) return;

    if (state.phase === 'TUTORIAL') {
      if (state.tutorialStep === 3 && cell.action === 'PLACE_BURGER') {
        dispatch({ type: 'TUTORIAL_PLACE_BURGER' });
        SoundManager.playGrillSizzle();
      } else if (state.tutorialStep === 5 && cell.action === 'FLIP') {
        dispatch({ type: 'TUTORIAL_FLIP' });
        SoundManager.playGrillSizzle();
      } else if (state.tutorialStep === 7 && cell.action === 'PLATE') {
        dispatch({ type: 'TUTORIAL_PLATE' });
        SoundManager.plateClink();
        SoundManager.tutorialChime();
      }
      return;
    }

    if (station === STATIONS.GRILL) {
      if (cell.action === 'PLACE_BURGER') { dispatch({ type: 'GRILL_PLACE', itemType: 'BURGER' }); SoundManager.playGrillSizzle(); }
      else if (cell.action === 'PLACE_GROUPER') { dispatch({ type: 'GRILL_PLACE', itemType: 'GROUPER' }); SoundManager.playGrillSizzle(); }
      else if (cell.action === 'PLACE_CHICKEN') { dispatch({ type: 'GRILL_PLACE', itemType: 'CHICKEN' }); SoundManager.playGrillSizzle(); }
      else if (cell.action === 'SEASON') { dispatch({ type: 'GRILL_SEASON' }); }
      else if (cell.action === 'FLIP') { dispatch({ type: 'GRILL_FLIP' }); SoundManager.playGrillSizzle(); }
      else if (cell.action === 'PLATE') { dispatch({ type: 'GRILL_PLATE' }); SoundManager.plateClink(); }
    }

    if (station === STATIONS.FRYER) {
      if (cell.action === 'BATCH_1') { dispatch({ type: 'SET_BATCH', size: 1 }); }
      else if (cell.action === 'BATCH_3') { dispatch({ type: 'SET_BATCH', size: 3 }); }
      else if (cell.action === 'SHAKE_OR_MILK') {
        var needsShake = stationData.items.some(function(it) { return it.needsShake; });
        if (needsShake) { dispatch({ type: 'FRYER_SHAKE' }); }
        else { dispatch({ type: 'FRYER_MILKSHAKE' }); }
      }
      else if (cell.action === 'PLATE') { dispatch({ type: 'FRYER_PLATE' }); SoundManager.plateClink(); }
      else if (cell.action === 'BOWL') {
        if (state.holdingBowl) {
          dispatch({ type: 'FRYER_PLACE', itemType: state.holdingBowl.type, fromBowl: true });
        }
      }
      else if (cell.action === 'PLACE_FRIES') { dispatch({ type: 'FRYER_PLACE', itemType: 'FRIES' }); SoundManager.playGrillSizzle(); }
      else if (cell.action === 'PLACE_SHROOMS') { dispatch({ type: 'FRYER_PLACE', itemType: 'SHROOMS' }); SoundManager.playGrillSizzle(); }
      else if (cell.action === 'PLACE_GBEANS') { dispatch({ type: 'FRYER_PLACE', itemType: 'G.BEANS' }); SoundManager.playGrillSizzle(); }
      else if (cell.action === 'PLACE_WINGS') { dispatch({ type: 'FRYER_PLACE', itemType: 'WINGS' }); SoundManager.playGrillSizzle(); }
      else if (cell.action === 'PLACE_CHBALL') { dispatch({ type: 'FRYER_PLACE', itemType: 'CH.BALL' }); SoundManager.playGrillSizzle(); }
    }

    if (station === STATIONS.PREP) {
      if (cell.action === 'DOUGH') { dispatch({ type: 'PREP_DOUGH' }); }
      else if (cell.action === 'SEND_OVEN') { dispatch({ type: 'SEND_TO_OVEN' }); }
      else if (cell.action === 'TOP_SAUCE') { dispatch({ type: 'PREP_TOPPING', topping: 'SAUCE' }); }
      else if (cell.action === 'TOP_SHRMS') { dispatch({ type: 'PREP_TOPPING', topping: 'SHRMS' }); }
      else if (cell.action === 'TOP_CHEESE') { dispatch({ type: 'PREP_TOPPING', topping: 'CHEESE' }); }
      else if (cell.action === 'TOP_PPRONI') { dispatch({ type: 'PREP_TOPPING', topping: 'PPRONI' }); }
      else if (cell.action === 'TOP_GRPEPR') { dispatch({ type: 'PREP_TOPPING', topping: 'GRPEPR' }); }
    }

    if (station === STATIONS.SALAD) {
      if (cell.action === 'PLATE') { dispatch({ type: 'SALAD_PLATE' }); SoundManager.plateClink(); }
      else if (cell.action === 'ADD_LETTUCE') { dispatch({ type: 'SALAD_ADD', ingredient: 'LETTUCE' }); }
      else if (cell.action === 'ADD_TOMATO') { dispatch({ type: 'SALAD_ADD', ingredient: 'TOMATO' }); }
      else if (cell.action === 'ADD_ONION') { dispatch({ type: 'SALAD_ADD', ingredient: 'ONION' }); }
      else if (cell.action === 'ADD_CROUTON') { dispatch({ type: 'SALAD_ADD', ingredient: 'CROUTON' }); }
      else if (cell.action === 'ADD_DRESSNG') { dispatch({ type: 'SALAD_ADD', ingredient: 'DRESSNG' }); }
    }
  }

  // Handle BOWL button replacement for x1
  var displayGrid = gridData.map(function(cell, idx) {
    if (station === STATIONS.FRYER && cell.action === 'BATCH_1' && state.holdingBowl && state.holdingBowl.count > 0) {
      return { label: 'BOWL', color: '#71717a', action: 'BOWL' };
    }
    return cell;
  });

  // Fryer batch size visual
  var activeBatch = state.batchSize;

  return e('div', { className: 'active-grid-area' },
    e('div', { className: 'active-grid', style: { left: leftPercent } },
      displayGrid.map(function(cell, idx) {
        var valid = isCellValid(cell, idx);
        var pulsing = false;

        if (state.phase === 'TUTORIAL') {
          if (state.tutorialStep === 3 && cell.action === 'PLACE_BURGER') pulsing = true;
          if (state.tutorialStep === 5 && cell.action === 'FLIP') pulsing = true;
          if (state.tutorialStep === 7 && cell.action === 'PLATE') pulsing = true;
        }

        // Shake pulse when items need shaking
        if (station === STATIONS.FRYER && cell.action === 'SHAKE_OR_MILK') {
          var needsShake = stationData.items.some(function(it) { return it.needsShake; });
          if (needsShake) pulsing = true;
        }

        var cellStyle = {
          backgroundColor: cell.color,
          opacity: (!cell.action || !valid) && cell.action !== null ? 0.4 : 1
        };

        // Batch size active indicator
        if (station === STATIONS.FRYER) {
          if (cell.action === 'BATCH_1' && activeBatch === 1) {
            cellStyle.borderBottom = '2px solid #fff';
          }
          if (cell.action === 'BATCH_3' && activeBatch === 3) {
            cellStyle.borderBottom = '2px solid #fff';
          }
        }

        // Empty cells full opacity but not interactive
        if (!cell.action && cell.label === '') {
          cellStyle.opacity = 1;
        }

        var className = 'grid-cell';
        if (!valid && cell.action) className += ' disabled';
        if (pulsing) className += ' pulsing';

        return e('div', {
          key: idx,
          className: className,
          style: cellStyle,
          onClick: function() { if (valid) handleCellClick(cell); }
        }, cell.label);
      })
    )
  );
}

function MiniGrid(props) {
  var stationName = props.station;
  var state = props.state;
  var gridData = STATION_GRIDS[stationName] || [];
  var stationData = state.stations[stationName] || {};
  var items = stationData.items || [];

  return e('div', { className: 'mini-grid' },
    gridData.map(function(cell, idx) {
      var alertClass = '';

      // Check for alerts
      if (stationName === STATIONS.GRILL || stationName === STATIONS.FRYER) {
        items.forEach(function(it) {
          if (it.burned && (cell.action === 'PLACE_' + it.type || cell.label === it.type)) {
            alertClass = 'alert-red';
          }
          if (it.needsFlip && cell.action === 'FLIP') alertClass = 'alert-yellow';
          if (it.needsShake && (cell.action === 'SHAKE_OR_MILK' || cell.action === 'FLIP')) alertClass = 'alert-yellow';
          if (it.done && cell.action === 'PLATE') alertClass = 'alert-green';
        });
      }

      var bg = alertClass ? cell.color : dimColor(cell.color, 0.4);

      return e('div', {
        key: idx,
        className: 'mini-cell ' + alertClass,
        style: { backgroundColor: bg }
      });
    })
  );
}

function getDanPosition(station) {
  switch (station) {
    case STATIONS.PIZZA_OVEN: return { left: '8%', top: '10px' };
    case STATIONS.GRILL: return { left: '40%', top: '10px' };
    case STATIONS.FRYER: return { left: '68%', top: '10px' };
    case STATIONS.PREP: return { left: 'calc(40% - 50px)', top: '50px' };
    case STATIONS.SALAD: return { left: 'calc(40% - 50px)', top: '95px' };
    default: return { left: '40%', top: '10px' };
  }
}

function KitchenScene(props) {
  var state = props.state;
  var dispatch = props.dispatch;

  var danPos = getDanPosition(state.danPosition);
  var isTutorial = state.phase === 'TUTORIAL';
  var showTickets = state.danFacing === 'COUNTER' || state.ticketPeek || (isTutorial && state.tutorialStep >= 2);
  var showPeekBtn = state.danFacing === 'BACK_WALL' && !isTutorial && state.phase === 'PLAYING';

  // Station click handler
  function onStationClick(station) {
    if (isTutorial) {
      if (station === STATIONS.GRILL && (state.tutorialStep === 2 || state.tutorialStep === 3)) {
        dispatch({ type: 'TUTORIAL_TAP_GRILL' });
      }
      return;
    }
    dispatch({ type: 'MOVE_DAN', station: station });
  }

  // Render cooking items on active station
  function renderStationContent(stationName) {
    var sd = state.stations[stationName];
    if (!sd) return null;

    if (stationName === STATIONS.GRILL && state.danPosition === STATIONS.GRILL) {
      return e('div', { className: 'grill-surface' },
        sd.items.map(function(it, idx) {
          var progress = it.cookProgress / it.cookTime;
          var rawColor = '#deb887';
          var cookedColor = '#8b4513';
          var burnedColor = '#333';
          var r = it.burned ? burnedColor : (progress > 0.5 ? cookedColor : rawColor);
          var barW = Math.min(100, (progress / (it.flipped ? 1 : FLIP_FRACTION)) * 100);
          var barColor = cookProgressColor(Math.min(progress, 1));
          return e('div', { key: idx, className: 'cook-item' },
            e('div', { className: 'cook-item-visual', style: { backgroundColor: r } }),
            e('div', { className: 'cook-item-bar' },
              e('div', { className: 'cook-item-bar-fill', style: { width: barW + '%', backgroundColor: barColor } })
            ),
            e('div', { className: 'cook-item-label' }, it.type)
          );
        })
      );
    }

    if (stationName === STATIONS.FRYER && state.danPosition === STATIONS.FRYER) {
      return e('div', { className: 'fryer-surface' },
        sd.items.map(function(it, idx) {
          var progress = it.cookProgress / it.cookTime;
          var barW = Math.min(100, progress * 100);
          var barColor = cookProgressColor(Math.min(progress, 1));
          return e('div', { key: idx, className: 'cook-item' },
            e('div', { className: 'cook-item-visual', style: { backgroundColor: it.done ? '#8b4513' : '#deb887', width: 24, height: 16 } }),
            e('div', { className: 'cook-item-bar', style: { width: 24 } },
              e('div', { className: 'cook-item-bar-fill', style: { width: barW + '%', backgroundColor: barColor } })
            ),
            e('div', { className: 'cook-item-label' }, (it.qty > 1 ? it.qty + 'x ' : '') + it.type)
          );
        }),
        state.holdingBowl ? e('div', { className: 'holding-bowl' }, state.holdingBowl.count + 'x') : null
      );
    }

    return null;
  }

  return e('div', { className: 'kitchen-scene' },
    // Back wall
    e('div', { className: 'back-wall' },
      // Pizza Oven - LEFT
      e('div', {
        className: 'station-box' + (state.danPosition === STATIONS.PIZZA_OVEN ? ' active' : ''),
        onClick: function() { onStationClick(STATIONS.PIZZA_OVEN); },
        style: isTutorial ? { opacity: 0.4 } : {}
      },
        e('div', { className: 'station-label' }, 'PIZZA OVEN'),
        state.danPosition !== STATIONS.PIZZA_OVEN ? e(MiniGrid, { station: STATIONS.PREP, state: state }) : null,
        state.stations.PIZZA_OVEN.pizza ? e('div', {
          style: {
            width: 20, height: 20, borderRadius: '50%', background: '#ca8a04', margin: '4px auto',
            border: '2px solid ' + (state.stations.PIZZA_OVEN.cookProgress >= COOK_TIMES.PIZZA ? '#22c55e' : cookProgressColor(state.stations.PIZZA_OVEN.cookProgress / COOK_TIMES.PIZZA))
          }
        }) : null
      ),

      // Grill - CENTER
      e('div', {
        className: 'station-box' + (state.danPosition === STATIONS.GRILL ? ' active' : ''),
        onClick: function() { onStationClick(STATIONS.GRILL); },
        style: isTutorial && state.tutorialStep === 2 ? { animation: 'pulse 1.5s infinite' } : {}
      },
        e('div', { className: 'station-label' }, 'GRILL'),
        state.danPosition !== STATIONS.GRILL ? e(MiniGrid, { station: STATIONS.GRILL, state: state }) : null,
        renderStationContent(STATIONS.GRILL)
      ),

      // Fryer - RIGHT
      e('div', {
        className: 'station-box' + (state.danPosition === STATIONS.FRYER ? ' active' : ''),
        onClick: function() { onStationClick(STATIONS.FRYER); },
        style: isTutorial ? { opacity: 0.4 } : {}
      },
        e('div', { className: 'station-label' }, 'FRYER'),
        state.danPosition !== STATIONS.FRYER ? e(MiniGrid, { station: STATIONS.FRYER, state: state }) : null,
        renderStationContent(STATIONS.FRYER)
      ),

      // Freezer - FAR RIGHT
      e('div', { className: 'station-box freezer', style: { background: '#1a1a2a', border: '1px solid #335' } },
        e('div', { className: 'station-label' }, 'FREEZER')
      )
    ),

    // Lower area - L counter, prep, salad, Dan, tickets
    e('div', { className: 'lower-area' },
      // L counter horizontal arm
      e('div', { className: 'l-horizontal' },
        // Plated food
        state.counterPlates.map(function(plate, idx) {
          var age = state.shiftTime - plate.platedAt;
          var cooling = age > 30;
          var ticket = state.ticketRail.find(function(t) { return t.id === plate.ticketId; });
          var complete = ticket && ticket.completed;
          return e('div', {
            key: idx,
            className: 'plate-circle' + (cooling ? ' cooling' : '') + (complete ? ' complete' : ''),
            style: {
              backgroundColor: ITEM_COLORS[plate.type] || '#888',
              left: (4 + idx * 18) + 'px',
              top: '4px'
            }
          }, plate.type.charAt(0));
        })
      ),

      // L counter vertical arm
      e('div', { className: 'l-vertical' }),

      // Prep station - LEFT of vertical arm
      e('div', { className: 'prep-area', style: { top: '30px' } },
        e('div', {
          className: 'prep-station' + (state.danPosition === STATIONS.PREP ? ' active' : ''),
          onClick: function() { onStationClick(STATIONS.PREP); },
          style: isTutorial ? { opacity: 0.4 } : {}
        }, 'PREP'),
        e('div', {
          className: 'prep-station' + (state.danPosition === STATIONS.SALAD ? ' active' : ''),
          onClick: function() { onStationClick(STATIONS.SALAD); },
          style: isTutorial ? { opacity: 0.4 } : {}
        }, 'SALAD')
      ),

      // Dan sprite
      e('div', {
        className: 'dan-sprite' + (state.inMeltdown ? ' meltdown' : ''),
        style: {
          left: danPos.left,
          top: danPos.top
        }
      }),

      // Ticket rail
      showTickets ? e('div', { className: 'ticket-rail' },
        state.ticketRail.map(function(ticket) {
          var age = state.shiftTime - ticket.arrivalTime;
          var className = 'ticket';
          if (ticket.completed) className += ' complete';
          else if (isTutorial) className += ' tutorial-glow';
          else if (age > 30) className += ' old';
          else if (age > 15) className += ' aging';
          return e('div', { key: ticket.id, className: className }, ticket.label);
        })
      ) : null,

      // Peek button
      showPeekBtn ? e('button', {
        className: 'tickets-peek-btn',
        onClick: function() { dispatch({ type: 'PEEK_TICKETS' }); }
      }, 'TICKETS') : null
    ),

    // Meltdown meter (hidden during tutorial)
    (state.phase === 'PLAYING') ? e('div', { className: 'meltdown-meter' },
      e('div', {
        className: 'meltdown-fill',
        style: {
          height: state.meltdown + '%',
          background: state.meltdown < 30 ? '#3b82f6' : (state.meltdown < 60 ? '#eab308' : (state.meltdown < 90 ? '#ef4444' : '#991b1b'))
        }
      })
    ) : null,

    // Meltdown vignette
    state.inMeltdown ? e('div', { className: 'meltdown-vignette' }) : null,

    // Hint message
    state.hintMessage ? e('div', { className: 'hint-message' }, state.hintMessage) : null,

    // NICE text
    state.niceShow ? e('div', { className: 'nice-text' }, 'NICE.') : null
  );
}

function ResultsScreen(props) {
  var score = props.state.score;
  var stars = '';
  for (var i = 0; i < 5; i++) {
    stars += i < score.stars ? '\u2605' : '\u2606';
  }
  return e('div', { className: 'results-screen' },
    e('div', { className: 'results-title' }, 'SHIFT OVER'),
    e('div', { className: 'results-line' }, 'Tickets: ' + score.ticketsCompleted + ' / ' + score.totalTickets),
    e('div', { className: 'results-line' }, 'Items burned: ' + score.itemsBurned),
    e('div', { className: 'results-line' }, 'Meltdowns: ' + props.state.meltdownCount),
    e('div', { className: 'results-stars' }, stars),
    e('button', {
      className: 'play-again-btn',
      onClick: function() { props.dispatch({ type: 'RESET' }); }
    }, 'TAP TO PLAY AGAIN')
  );
}

function Game() {
  var ref = useReducer(gameReducer, null, makeInitialState);
  var state = ref[0];
  var dispatch = ref[1];
  var frameRef = useRef(null);
  var lastTimeRef = useRef(null);

  useEffect(function() {
    function tick(timestamp) {
      if (lastTimeRef.current === null) {
        lastTimeRef.current = timestamp;
        frameRef.current = requestAnimationFrame(tick);
        return;
      }
      var dt = (timestamp - lastTimeRef.current) / 1000;
      lastTimeRef.current = timestamp;
      if (dt > 0.1) dt = 0.1;
      dispatch({ type: 'TICK', dt: dt });
      frameRef.current = requestAnimationFrame(tick);
    }
    frameRef.current = requestAnimationFrame(tick);
    return function() {
      if (frameRef.current) cancelAnimationFrame(frameRef.current);
    };
  }, []);

  if (state.phase === 'TITLE') {
    return e(TitleScreen, { onStart: function() { dispatch({ type: 'START_GAME' }); } });
  }

  if (state.phase === 'SHIFT_END') {
    return e(ResultsScreen, { state: state, dispatch: dispatch });
  }

  return e('div', { className: 'game-container' },
    e(ActiveGrid, { station: state.danPosition, state: state, dispatch: dispatch }),
    e(KitchenScene, { state: state, dispatch: dispatch })
  );
}

// ==================== MOUNT ====================
var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(Game));
</script>
